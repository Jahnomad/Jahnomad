<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090e18">
<title>Затерянные в Реутове — JAH NOMAD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#090e18;font-family:system-ui;color:#eec8aa}
#canvas{display:block;position:fixed;inset:0;width:100%;height:100%;background:#090e18;outline:0}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,#263445,#070e18);z-index:2;text-align:center;transition:opacity .3s}
#loading.hidden{opacity:0;pointer-events:none}
#loading h1{letter-spacing:.18em;font-size:clamp(30px,6vw,68px);color:#e5a076;text-shadow:0 3px #5c3249;margin:0 0 20px}
#loading h2{font-size:clamp(12px,2.1vw,19px);letter-spacing:.14em;margin:0 0 24px;font-weight:500}
#progress{height:10px;border:2px solid #8a6a64;background:#142331;width:min(76vw,400px)}
#fill{height:100%;width:0;background:#ddac7a;transition:width .25s}
#percent{font-size:13px;color:#b4c9cb;margin-top:12px}
#full{position:fixed;right:16px;top:16px;z-index:1;background:#1e364b;color:#eee5d6;border:1px solid #7d9ba6;border-radius:8px;padding:12px 15px;cursor:pointer;touch-action:manipulation}
#error{display:none;position:fixed;inset:auto 12px 14px;background:#502532;color:#fff;border:2px solid #d27580;padding:14px;max-height:45%;overflow:auto;z-index:5;white-space:pre-wrap}
#rotate{display:none;position:fixed;inset:0;background:#090e18f2;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:20px;z-index:4}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
</style></head><body>
<canvas id="canvas" tabindex="0" aria-label="Затерянные в Реутове"></canvas>
<div id="loading"><h1>JAH NOMAD</h1><h2>ЗАТЕРЯННЫЕ В РЕУТОВЕ · 1996</h2><div id="progress"><div id="fill"></div></div><div id="percent">Загрузка: 0%</div></div>
<button id="full" type="button" aria-label="Полный экран">⛶</button>
<div id="error" role="alert"></div><div id="rotate">Поверните телефон горизонтально.</div>
<script>
"use strict";
const canvas=document.getElementById("canvas");
const loading=document.getElementById("loading");
const failure=(message)=>{document.getElementById("error").style.display="block";document.getElementById("error").textContent="Ошибка WebGL: "+String(message);loading.classList.add("hidden");console.error(message)};
if(!window.WebGLRenderingContext)failure("Браузер не поддерживает WebGL");
else {
 const s=document.createElement("script");
 s.src="{{LOADER}}";
 s.onerror=()=>failure("Не удалось загрузить Unity loader");
 s.onload=()=>createUnityInstance(canvas,{
  dataUrl:"{{DATA}}",frameworkUrl:"{{FRAMEWORK}}",codeUrl:"{{WASM}}",
  streamingAssetsUrl:"StreamingAssets",companyName:"JAH NOMAD",productName:"Затерянные в Реутове",productVersion:"Sprint 0",
  devicePixelRatio:Math.min(window.devicePixelRatio||1,innerWidth<950?1.5:2),
  showBanner:(msg)=>failure(msg)
 },progress=>{const pct=Math.round(progress*100);document.getElementById("fill").style.width=pct+"%";document.getElementById("percent").textContent="Загрузка: "+pct+"%"})
 .then(instance=>{window.game=instance;loading.classList.add("hidden");document.getElementById("full").onclick=()=>instance.SetFullscreen(1)})
 .catch(failure);
 document.head.appendChild(s);
}
</script></body></html>
