name: Unity source preflight
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Unity source
        uses: actions/checkout@v4
      - name: Install C# syntax parser
        run: python3 -m pip install --disable-pip-version-check --quiet tree-sitter tree-sitter-c-sharp
      - name: Validate Unity structure and source code
        run: python3 tools/validate_unity.py
