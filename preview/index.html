<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070d1b">
<title>Затерянные в Реутове — JAH NOMAD | предпросмотр</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#070d1b;color:#ffe1b6;font-family:Consolas,'Courier New',monospace}
canvas{display:block;width:100%;height:100%;touch-action:none;image-rendering:pixelated}
#veil{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#050d1bdb;padding:18px;z-index:5}
#veil.open{display:flex}
article{background:linear-gradient(145deg,#17283d,#09101f);border:2px solid #51c5d6;box-shadow:0 16px 50px #000d;max-width:650px;width:min(95%,650px);padding:clamp(17px,3vw,38px);text-align:center}
h1{font-size:clamp(22px,3vw,34px);line-height:1.3;margin:0 0 22px;color:#f5ad70}
p{font-size:clamp(14px,1.8vw,20px);line-height:1.5}
nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:26px}
button{background:#172a40;color:#ffe7c7;border:2px solid #52b5c5;border-radius:3px;min-height:47px;padding:10px 19px;font-size:clamp(13px,1.5vw,18px);font-family:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,button:hover{outline:2px solid #f0b77a;outline-offset:2px}
#hint{position:fixed;bottom:11px;left:50%;transform:translateX(-50%);pointer-events:none;color:#d0c9bd;font-size:11px;text-align:center;text-shadow:0 2px 6px #000;background:#0b1224ac;padding:5px 12px}
#portrait{display:none;position:fixed;inset:0;background:#070d1be8;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:28px;z-index:8}
@media(orientation:portrait) and (max-width:720px){#portrait{display:flex}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Затерянные в Реутове, главное меню" tabindex="0"></canvas>
<audio id="theme" src="./art/MenuTheme.ogg" loop preload="auto"></audio>
<div id="hint">JAH NOMAD · предпросмотр нового меню · Unity-сборка №3 отдельно</div>
<div id="veil" role="dialog" aria-modal="true" aria-labelledby="heading">
<article><h1 id="heading"></h1><p id="detail"></p>
<nav><button id="accept"></button><button id="dismiss">НАЗАД</button></nav></article></div>
<div id="portrait">Поверните телефон горизонтально.</div>
<script>
(()=>{"use strict";
const canvas=document.getElementById("scene"),ctx=canvas.getContext("2d",{alpha:false}),music=document.getElementById("theme"),veil=document.getElementById("veil");
const image=new Image();image.src="./art/MenuMaster.png";
let frame={x:0,y:0,w:1,h:1,s:1},selection=-1,mute=false,dialog=false,px=0,py=0;
const choices=[
{box:[600,406,1050,500],go:newGame},
{box:[631,503,1020,576],go:settings},
{box:[633,583,1020,659],go:sound},
{box:[631,669,1020,740],go:exitInfo}
];
function fit(mode){const ratio=(mode==="cover"?Math.max:Math.min)(innerWidth/image.width,innerHeight/image.height);return{x:(innerWidth-image.width*ratio)/2,y:(innerHeight-image.height*ratio)/2,w:image.width*ratio,h:image.height*ratio,s:ratio}}
function redraw(){if(!image.complete||!image.naturalWidth)return;ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle="#060d1e";ctx.fillRect(0,0,innerWidth,innerHeight);const cover=fit("cover");ctx.globalAlpha=.32;ctx.drawImage(image,cover.x,cover.y,cover.w,cover.h);ctx.globalAlpha=1;frame=fit("contain");ctx.drawImage(image,frame.x,frame.y,frame.w,frame.h);
if(selection>=0&&!dialog){const b=choices[selection].box;ctx.strokeStyle="#94d7dd";ctx.lineWidth=2;ctx.strokeRect(frame.x+b[0]*frame.s,frame.y+b[1]*frame.s,(b[2]-b[0])*frame.s,(b[3]-b[1])*frame.s)}
}
function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(dpr,0,0,dpr,0,0);redraw()}
function local(event){return{x:(event.clientX-frame.x)/frame.s,y:(event.clientY-frame.y)/frame.s}}
function menuIndex(event){const p=local(event);return choices.findIndex(c=>p.x>=c.box[0]&&p.x<=c.box[2]&&p.y>=c.box[1]&&p.y<=c.box[3])}
async function play(){if(mute)return;music.volume=.4;try{await music.play()}catch(e){console.info("Музыка ждёт первого касания",e)}}
function show(title,message,positive,action){dialog=true;document.getElementById("heading").textContent=title;document.getElementById("detail").textContent=message;const a=document.getElementById("accept");a.textContent=positive;a.onclick=action;veil.classList.add("open");redraw()}
function close(){dialog=false;veil.classList.remove("open");redraw()}
function newGame(){play();show("РЕУТОВ · 1996 ГОД","Миша ищет пропавшего брата. На Юбилейном гаснут фонари, а по двору ездят чёрные «Волги» без номеров. Утверждённый первый игровой уровень включён в исходники Unity, но для его запуска требуется новая WebGL-сборка.","ПОНЯТНО",close)}
function settings(){play();show("НАСТРОЙКИ","Горизонтальная ориентация. Для музыки нажмите экран. Стрелки вверх/вниз и Enter работают на компьютере.","НАЗАД",close)}
function sound(){mute=!mute;if(mute)music.pause();else play();show("ЗВУК",mute?"Музыка выключена.":"Музыка включена. Синтвейв-тема загружена из Unity-ресурсов.","НАЗАД",close)}
function exitInfo(){show("ЗАТЕРЯННЫЕ В РЕУТОВЕ","Это предпросмотр утверждённого оформления и музыки. Он не заменяет текущую Unity-сборку.","НАЗАД",close)}
canvas.addEventListener("pointermove",e=>{if(dialog)return;const found=menuIndex(e);if(found!==selection){selection=found;redraw()}},{passive:true});
canvas.addEventListener("pointerdown",e=>{px=e.clientX;py=e.clientY},{passive:true});
canvas.addEventListener("pointerup",e=>{e.preventDefault();if(dialog)return;if(Math.hypot(px-e.clientX,py-e.clientY)>24)return;const i=menuIndex(e);if(i>=0){selection=i;choices[i].go();redraw()}},{passive:false});
window.addEventListener("keydown",e=>{if(e.key==="Escape"){close();return}if(dialog){if(e.key==="Enter")close();return}if(e.key==="ArrowDown"||e.key==="ArrowUp"){selection=(selection+(e.key==="ArrowDown"?1:choices.length-1))%choices.length;redraw();e.preventDefault()}if(e.key==="Enter"&&selection>=0){choices[selection].go();e.preventDefault()}});
document.getElementById("dismiss").onclick=close;document.addEventListener("visibilitychange",()=>{if(document.hidden)music.pause()});window.addEventListener("resize",resize);image.onload=resize;image.onerror=()=>{document.getElementById("hint").textContent="Ошибка загрузки изображения. Обновите страницу.";};
resize();
})();
</script>
</body></html>
